spring:
  application:
    name: consignado-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/consignado}
    username: ${DB_USERNAME:consignado}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway. Hibernate only checks that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful
