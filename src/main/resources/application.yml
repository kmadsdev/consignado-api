spring:
  application:
    name: consignado-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/consignado}
    username: ${DB_USERNAME:consignado}
    # No default on purpose: set DB_PASSWORD in the environment (docker-compose.yml does it for local runs).
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway. Hibernate only checks that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready only when the database answers; liveness stays independent of it.
        readiness:
          include: readinessState, db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

logging:
  structured:
    format:
      console: io.github.kmadsdev.consignado.observability.JsonLogFormatter

consignado:
  simulation:
    validity: P7D
  outbox:
    relay:
      enabled: true
    publisher: log
    poll-interval: PT2S
    batch-size: 100
    max-attempts: 10
