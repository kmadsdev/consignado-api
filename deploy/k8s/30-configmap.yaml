# Non-secret configuration. The application reads DB_URL and DB_USERNAME
# (src/main/resources/application.yml). PG_HOST is the full host name (FQDN) of the
# server, so a private endpoint or another DNS zone needs no change here.
# Azure PostgreSQL requires TLS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: consignado-api
  namespace: consignado
data:
  DB_URL: "jdbc:postgresql://${PG_HOST}:5432/${PG_DB}?sslmode=require"
  DB_USERNAME: "${PG_ADMIN}"
