# Secrets Store CSI driver: reads "db-password" from Key Vault with the pod's
# workload identity, mounts it as a file, and copies it to the Kubernetes Secret
# "consignado-db" for as long as a pod mounts the volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: consignado-kv
  namespace: consignado
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${APP_CLIENT_ID}"
    keyvaultName: "${KV}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: consignado-db
      type: Opaque
      data:
        - objectName: db-password
          key: db-password
