name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + slice tests (Surefire), integration tests on PostgreSQL via
      # Testcontainers (Failsafe), JaCoCo report and the coverage gate.
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { missed+=$8; covered+=$9 } END { printf "Line coverage: %.1f%% (%d of %d lines)\n", 100*covered/(missed+covered), covered, missed+covered }' \
              target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  docker:
    name: Docker image and smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t consignado-api:ci .

      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id consignado-api:ci -u)" = "10001"

      - name: Start app and database
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Smoke test the API
        run: |
          set -euo pipefail
          agreement=$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/agreements \
            -H 'Content-Type: application/json' \
            -d '{"code":"SMOKE","name":"Smoke test","maxMarginPercent":35,"maxTermMonths":96,"monthlyInterestRate":0.015}' \
            | jq -r .id)
          test -n "$agreement" && test "$agreement" != "null"
          curl -fsS http://127.0.0.1:8080/v3/api-docs | jq -e '.paths["/api/v1/contracts"]' > /dev/null
          # Store first: "grep -q" closes the pipe early and curl would fail with a write error.
          metrics=$(curl -fsS http://127.0.0.1:8080/actuator/prometheus)
          grep -q '^jvm_memory_used_bytes' <<< "$metrics"

      - name: Stop
        if: always()
        run: docker compose down -v

  # Runs only for a push to main. Login is OIDC: GitHub proves "this repository,
  # branch main" and Azure gives a short-lived token. No password is stored.
  deploy:
    name: Deploy to AKS
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write            # lets the job ask GitHub for an OIDC token
    concurrency:
      group: deploy-aks          # never two deploys at the same time
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/consignado-api:${{ github.sha }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      KV: ${{ vars.KV_NAME }}
      PG: ${{ vars.PG_SERVER }}
      PG_DB: ${{ vars.PG_DB }}
      PG_ADMIN: ${{ vars.PG_ADMIN }}
      ALLOWED_CIDR: ${{ secrets.ALLOWED_CIDR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC, no secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image to ACR
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Get the AKS credentials
        run: az aks get-credentials --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AKS_NAME }}" --overwrite-existing

      - name: Apply the manifests
        run: ./deploy/render.sh | kubectl apply -f -

      - name: Wait for the rollout
        run: kubectl -n consignado rollout status deployment/consignado-api --timeout=300s

      - name: Smoke test from inside the cluster
        run: |
          kubectl -n consignado run smoke-${{ github.run_id }} --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 --command -- \
            curl -fsS http://consignado-api.consignado.svc/actuator/health/readiness

      - name: Show what runs now
        if: always()
        run: kubectl -n consignado get deploy,pods -o wide
