name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + slice tests (Surefire), integration tests on PostgreSQL via
      # Testcontainers (Failsafe), JaCoCo report and the coverage gate.
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { missed+=$8; covered+=$9 } END { printf "Line coverage: %.1f%% (%d of %d lines)\n", 100*covered/(missed+covered), covered, missed+covered }' \
              target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  docker:
    name: Docker image and smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t consignado-api:ci .

      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id consignado-api:ci -u)" = "10001"

      - name: Start app and database
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Smoke test the API
        run: |
          set -euo pipefail
          agreement=$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/agreements \
            -H 'Content-Type: application/json' \
            -d '{"code":"SMOKE","name":"Smoke test","maxMarginPercent":35,"maxTermMonths":96,"monthlyInterestRate":0.015}' \
            | jq -r .id)
          test -n "$agreement" && test "$agreement" != "null"
          curl -fsS http://127.0.0.1:8080/v3/api-docs | jq -e '.paths["/api/v1/contracts"]' > /dev/null
          # Store first: "grep -q" closes the pipe early and curl would fail with a write error.
          metrics=$(curl -fsS http://127.0.0.1:8080/actuator/prometheus)
          grep -q '^jvm_memory_used_bytes' <<< "$metrics"

      - name: Stop
        if: always()
        run: docker compose down -v

  # Runs only for a push to main. Login is OIDC: GitHub proves "this repository,
  # branch main" and Azure gives a short-lived token. No password is stored.
  #
  # The cluster uses Entra ID with Azure RBAC for Kubernetes and has no local
  # accounts, so kubectl logs in with the same Azure identity (kubelogin).
  # The cluster is normally STOPPED to save cost: this job starts it when needed
  # and never stops it. The gateway's timer stops it again when no access window
  # is open (docs/adr/0007-two-hosts-one-api.md).
  #
  # The Azure IDs are secrets, not variables, because the logs of a public
  # repository are public and GitHub masks secrets in them. No step prints the
  # kubeconfig or a token.
  deploy:
    name: Deploy to AKS
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45          # a cold start of the cluster takes several minutes
    permissions:
      contents: read
      id-token: write            # lets the job ask GitHub for an OIDC token
    concurrency:
      group: deploy-aks          # never two deploys at the same time
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      AKS_NAME: ${{ vars.AKS_NAME }}
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/consignado-api:${{ github.sha }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      KV: ${{ vars.KV_NAME }}
      PG_HOST: ${{ vars.PG_HOST }}
      PG_DB: ${{ vars.PG_DB }}
      PG_ADMIN: ${{ vars.PG_ADMIN }}
      LB_IP: "10.10.3.200"       # the fixed private IP in deploy/k8s/50-service.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC, no secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image to ACR
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # "az aks show" prints one word here (--query ... -o tsv), never the full
      # resource, which holds the subscription and tenant IDs.
      - name: Start the cluster when it is stopped
        run: |
          set -euo pipefail
          state() { az aks show --resource-group "$RESOURCE_GROUP" --name "$AKS_NAME" --query "$1" --output tsv; }

          # The gateway's timer may be starting or stopping the cluster right now.
          # A start during another operation fails, so wait until it settles (10 minutes at most).
          for i in $(seq 1 40); do
            provisioning=$(state provisioningState)
            case "$provisioning" in
              Starting|Stopping|Updating) echo "cluster is $provisioning, waiting"; sleep 15 ;;
              *) break ;;
            esac
          done

          power=$(state powerState.code)
          echo "power state: $power"
          if [ "$power" = "Stopped" ]; then
            # "az aks start" returns when the cluster runs. Azure can refuse a start
            # that comes too soon after a stop, so try again after a pause.
            for attempt in 1 2 3; do
              if az aks start --resource-group "$RESOURCE_GROUP" --name "$AKS_NAME" --output none; then break; fi
              if [ "$attempt" = 3 ]; then echo "the cluster did not start" >&2; exit 1; fi
              echo "start attempt $attempt failed, waiting 3 minutes"
              sleep 180
            done
          fi
          test "$(state powerState.code)" = "Running"
          echo "power state: Running"

      # The token from the first login comes from a GitHub OIDC assertion that is
      # valid for a few minutes. After a long cluster start the Azure CLI cannot use
      # it to get a token for Kubernetes, so log in again with a new assertion.
      - name: Azure login again (new OIDC assertion after the start)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubelogin
        uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: v0.2.22

      # The kubeconfig holds no credential: kubelogin makes kubectl ask the Azure
      # CLI session of this job for a token on each call. Azure RBAC decides what
      # the CI identity may do in the cluster.
      - name: Get the AKS credentials (Entra ID, no local account)
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing --output none
          kubelogin convert-kubeconfig -l azurecli
          # The CI identity has rights in the namespace "consignado" only, so it cannot
          # read nodes. Wait until the API server answers for that namespace.
          for i in $(seq 1 30); do
            if kubectl -n consignado get serviceaccounts --request-timeout=10s >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "The cluster API did not answer for the namespace consignado" >&2; exit 1

      - name: Apply the manifests
        run: ./deploy/render.sh | kubectl apply -f -

      - name: Wait for the rollout
        run: kubectl -n consignado rollout status deployment/consignado-api --timeout=300s

      - name: Smoke test from inside the cluster
        run: |
          kubectl -n consignado run smoke-${{ github.run_id }} --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 --command -- \
            curl -fsS http://consignado-api.consignado.svc/actuator/health/readiness

      # The gateway calls the API through the internal load balancer, so the
      # Service must hold exactly this private IP.
      - name: Check the internal load balancer IP
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            ip=$(kubectl -n consignado get service consignado-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ "$ip" = "$LB_IP" ]; then echo "internal load balancer: $ip"; exit 0; fi
            sleep 5
          done
          echo "the Service has IP '${ip:-none}', expected $LB_IP" >&2
          kubectl -n consignado describe service consignado-api | tail -n 15
          exit 1

      # No "stop" step on purpose: the gateway's timer owns the stop.
      - name: Show what runs now
        if: always()
        run: kubectl -n consignado get deploy,pods,service -o wide
